ClearOnDisconnect="Po skončení streamu nic nezobrazovat"
CloseWhenInactive="Zavřít stream, když zdroj není aktivní"
AdvancedHelp="Čekání na klíčový snímek zabrání rozbitému obrazu při startu a novém připojení, ale může přidat zpoždění až o jeden interval klíčových snímků. Zvuk v režimu s nízkým zpožděním zapne pro tenhle zdroj asynchronní zvuk OBS bez vyrovnávací paměti a plugin pak posílá zvuk hned, bez obvyklé rezervy: je to rychlejší, ale hůř to snáší kolísání sítě. Po skončení streamu nic nezobrazovat schová obraz hned, jak stream vypadne, místo aby do nového připojení zůstal stát poslední snímek. Zavřít stream, když zdroj není aktivní, přestane přijímat, když zdroj není vidět, a s předchozí volbou zároveň smaže obraz. Možnosti FFmpeg mohou přepsat kteroukoli volbu demuxeru, například buffer_size nebo latenci SRT."

# %1 je verze pluginu.
About="Kastry IRL zdroj v%1\nhttps://github.com/yzii23/kastry-irl-zdroj\n\nUpravená verze pluginu IRL Source od Thomase Lekangera (https://irlserver.com), kterou Kastry upravuje od 27. 10. 2026.\n\nŽivý zdroj pro libovolný kodek a protokol: rezerva proti kolísání zvuku, oprava časových značek, přizpůsobování zpoždění a čekání na první klíčový snímek.\n\nLicence AGPL-3.0-or-later"
