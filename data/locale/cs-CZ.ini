AudioBufferHelp="Cílová rezerva tlumí kolísání sítě a nejvíc ovlivňuje zpoždění. Přizpůsobování zpoždění drží zvuk blízko normální rychlosti a opravuje ji jen v mezích: co se nahromadí během zaseknutí, přehraje se mírně zrychleně a nic se nepřeskočí. Menší hodnota znamená menší zpoždění, ale při špatném signálu víc ticha nebo zadrhnutí. Když obraz od odesílatele chodí později než zvuk, zvuk se navíc pozdrží o ten rozdíl, aby seděl na rty. Rychlost dohánění říká, jak rychle se smí zpoždění dohánět: výchozích 5 % ho srovná rychle, ale u hudby je to slyšet. Nižší hodnota je méně slyšet a srovnání trvá úměrně déle."

